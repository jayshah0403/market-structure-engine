name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # pytest is a test-only dependency, so it is installed here rather than
        # added to requirements.txt (which is what the runtime image installs).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        # No CONNECTION_STRING is provided: the DB integration test skips itself
        # and the pure engine tests run without a database.
        run: python -m pytest -v
