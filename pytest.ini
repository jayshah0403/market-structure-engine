[pytest]
# Registered so `-m "not network"` / `-m "not slow"` work and unknown-mark
# warnings stay out of the output. Both are also skipped automatically when CI
# is set (GitHub Actions sets CI=true), so CI needs no marker expression.
markers =
    network: downloads from data.binance.vision; runs locally, skipped in CI
    slow: tens of seconds of pure compute; skipped in CI
